# Takt unter Zephyr mit Treibern aus dem Devicetree (8.10, 12.11): das Modul,
# die Pins und die Leitung.
CONFIG_TAKT=y
CONFIG_GPIO=y

# Die Leitung (12.2, 12.5): das UART-Geraet `takt,line` des Devicetree,
# gesendet aus seinem Interrupt, damit der Schritt nie auf sie wartet.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Die Frist ist auf einen Systemtick genau: 10 us statt der Vorgabe 100 us.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# `main` wartet unter dem Jobfaden, bis der Lauf endet, und schreibt die
# Bilanz (`takt_core_report`).
CONFIG_MAIN_THREAD_PRIORITY=14
CONFIG_MAIN_STACK_SIZE=4096
