# Board 1 (plan/f401.md): Sektor 0 haelt der HID-Bootloader, Sektor 1 das
# Sprungbrett; die Anwendung beginnt in Sektor 4 (0x0801_0000), wo das
# Sprungbrett sie startet, wie in examples/zephyr.
CONFIG_FLASH_LOAD_OFFSET=0x10000
CONFIG_FLASH_LOAD_SIZE=0x30000

# Die FPU mit der ABI des Tripels `thumbv7em-none-eabihf`; `CONFIG_TAKT`
# waehlt dazu `CONFIG_FPU_SHARING`.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# USART1 ist die Leitung, keine Konsole daneben.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
