# Takt ueber CMSIS-RTOS2 (12.11): das Modul mit dem generischen Adapter.
CONFIG_TAKT=y
CONFIG_TAKT_PORT_CMSIS_RTOS2=y

# Das Journal (5.9) im Flash, in der Partition `takt_journal` des
# Devicetree (boards/blackpill_f401cc.overlay).
CONFIG_TAKT_JOURNAL_FLASH=y

# Zephyrs CMSIS-RTOS2-Schicht und was sie verlangt: alle 56 Prioritaeten
# von CMSIS als verdraengbare des Zephyr-Kerns, Stacks mit Wasserstand.
CONFIG_CMSIS_RTOS_V2=y
CONFIG_POLL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_NUM_PREEMPT_PRIORITIES=56
CONFIG_CMSIS_V2_THREAD_MAX_STACK_SIZE=8192

# Die Leitung (12.2, 12.5): das UART-Geraet `takt,line` aus dem Interrupt.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Die Frist ist auf einen Systemtick genau: 10 us.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# `main` rechnet die fremde Last unter dem Jobfaden (`osPriorityHigh` ist
# im Zephyr-Kern 16) und schreibt am Ende die Bilanz.
CONFIG_MAIN_THREAD_PRIORITY=50
CONFIG_MAIN_STACK_SIZE=4096
