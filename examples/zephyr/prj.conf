# Takt unter Zephyr (12.11): das Modul, die Leitung und die fremde Last.
CONFIG_TAKT=y

# Das Journal (5.9) im Flash, in der Partition `takt_journal` des
# Devicetree (boards/*.overlay).
CONFIG_TAKT_JOURNAL_FLASH=y

# Die Leitung (12.2, 12.5): das UART-Geraet `takt,line` des Devicetree,
# gesendet aus seinem Interrupt, damit der Schritt nie auf sie wartet.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Die Arena in einer eigenen Partition, die keine Domaene eines Fadens im
# Benutzermodus enthaelt (12.11, `Schutz: Partition`).
CONFIG_USERSPACE=y

# Die Uhr des Ports ist ein Zaehler, den boards/*.overlay als `takt,timer`
# waehlt (FB-733); ohne ihn waere die Frist auf einen Systemtick genau.
CONFIG_COUNTER=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# `main` rechnet die fremde Last unter dem Jobfaden und schreibt am Ende die
# Bilanz (`takt_core_report`).
CONFIG_MAIN_THREAD_PRIORITY=14
CONFIG_MAIN_STACK_SIZE=4096
