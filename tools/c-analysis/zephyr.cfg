<?xml version="1.0"?>
<!-- Was cppcheck vom Zephyr-Kern und seiner CMSIS-RTOS2-Schicht wissen muss,
     um die Adapter `ports/zephyr` und `ports/cmsis-rtos2`, das Geraet
     `ports/zephyr-nvm` und die Beispiele `examples/zephyr` und
     `examples/cmsis-rtos2` ohne die Koepfe von Zephyr zu pruefen (plan/cert.md
     Abschnitt 6, FB-731): die Funktionen, die sie rufen, mit der Zahl ihrer
     Argumente und dem Typ ihres Werts, die Makros, die sie nutzen, und die
     Typen, deren Breite das MISRA-Addon braucht. Die Strukturen des
     Zephyr-Kerns (`struct k_sem`, `k_timeout_t`, `struct flash_area`, …)
     bleiben undurchsichtig.

     Ein Makro steht hier mit dem, was es im Bau der Beispiele fuer den F401
     wird (`blackpill_f401cc`, Zephyr 4.4.2), so knapp, wie die Pruefung es
     braucht; die Werte aus Kconfig sind die der Beispiele. Die Koepfe selbst
     liest cppcheck nicht: Sie lesen Register ueber `register … __asm__`, und
     das kann er nicht. -->
<def format="2">
  <!-- Die Konfiguration der Beispiele (autoconf.h). -->
  <define name="CONFIG_NUM_COOP_PRIORITIES" value="16"/>
  <define name="CONFIG_NUM_PREEMPT_PRIORITIES" value="15"/>
  <define name="CONFIG_SYS_CLOCK_TICKS_PER_SEC" value="100000"/>
  <define name="CONFIG_TAKT_STEP_PRIORITY" value="0"/>
  <define name="CONFIG_TAKT_JOB_PRIORITY" value="0"/>

  <!-- `zephyr/toolchain.h` und `zephyr/sys/util.h`. -->
  <define name="ARG_UNUSED(x)" value="(void)(x)"/>
  <define name="BUILD_ASSERT(cond,msg)" value="_Static_assert(cond, msg)"/>
  <define name="IS_ENABLED(flag)" value="0"/>
  <define name="DT_HAS_CHOSEN(prop)" value="0"/>
  <define name="DT_SAME_NODE(node_id1,node_id2)" value="1"/>
  <define name="FUNC_NORETURN" value="__attribute__((__noreturn__))"/>

  <!-- `zephyr/kernel.h`: Zeit, Prioritaeten, Faeden und ihre Stacks. -->
  <podtype name="k_ticks_t" sign="s" size="8"/>
  <define name="K_TICKS_FOREVER" value="((k_ticks_t)(-1))"/>
  <define name="K_FOREVER" value="((k_timeout_t){.ticks = K_TICKS_FOREVER})"/>
  <define name="K_NO_WAIT" value="((k_timeout_t){0})"/>
  <define name="K_SECONDS(s)" value="((k_timeout_t){.ticks = (k_ticks_t)(s) * CONFIG_SYS_CLOCK_TICKS_PER_SEC})"/>
  <define name="K_TIMEOUT_ABS_TICKS(t)" value="((k_timeout_t){.ticks = (K_TICKS_FOREVER - 1) - (k_ticks_t)(t)})"/>
  <define name="K_HIGHEST_THREAD_PRIO" value="(-CONFIG_NUM_COOP_PRIORITIES)"/>
  <define name="K_LOWEST_APPLICATION_THREAD_PRIO" value="(CONFIG_NUM_PREEMPT_PRIORITIES - 1)"/>
  <define name="K_PRIO_COOP(x)" value="(-(CONFIG_NUM_COOP_PRIORITIES - (x)))"/>
  <define name="K_PRIO_PREEMPT(x)" value="(x)"/>
  <define name="K_FP_REGS" value="(1UL &lt;&lt; 1)"/>
  <define name="K_USER" value="(1UL &lt;&lt; 2)"/>
  <!-- Der Stackwaechter der MPU fuer Faeden mit FPU. -->
  <define name="K_KERNEL_STACK_RESERVED" value="((size_t)128)"/>
  <define name="K_THREAD_STACK_RESERVED" value="((size_t)0)"/>
  <define name="K_KERNEL_STACK_DEFINE(sym,size)" value="k_thread_stack_t sym[(size) + K_KERNEL_STACK_RESERVED]"/>
  <define name="K_THREAD_STACK_DEFINE(sym,size)" value="k_thread_stack_t sym[(size) + K_THREAD_STACK_RESERVED]"/>
  <define name="K_THREAD_STACK_SIZEOF(sym)" value="(sizeof(sym) - K_THREAD_STACK_RESERVED)"/>
  <define name="K_SEM_DEFINE(name,initial,count_limit)" value="struct k_sem name = {.count = (initial), .limit = (count_limit)}"/>
  <function name="k_sem_init">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="out"><not-null/></arg>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"/>
  </function>
  <function name="k_sem_give">
    <returnValue type="void"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"><not-null/></arg>
  </function>
  <function name="k_sem_take,k_thread_join">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"><not-null/></arg>
    <arg nr="2" direction="in"/>
  </function>
  <function name="k_uptime_ticks">
    <returnValue type="long long"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
  </function>
  <function name="k_ticks_to_ns_floor64,k_ns_to_ticks_ceil64">
    <returnValue type="unsigned long long"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <pure/>
    <arg nr="1" direction="in"/>
  </function>
  <function name="k_current_get">
    <returnValue type="struct k_thread *"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
  </function>
  <function name="k_thread_priority_get">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>
  <function name="k_thread_create">
    <returnValue type="struct k_thread *"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="out"><not-null/></arg>
    <arg nr="2" direction="inout"><not-null/></arg>
    <arg nr="3" direction="in"/>
    <arg nr="4" direction="in"><not-null/></arg>
    <!-- Die Argumente des Einstiegs: Der Faden darf durch sie schreiben. -->
    <arg nr="5" direction="inout"/>
    <arg nr="6" direction="inout"/>
    <arg nr="7" direction="inout"/>
    <arg nr="8" direction="in"/>
    <arg nr="9" direction="in"/>
    <arg nr="10" direction="in"/>
  </function>
  <function name="k_fatal_halt">
    <returnValue type="void"/>
    <noreturn>true</noreturn>
    <arg nr="1" direction="in"/>
  </function>

  <!-- `zephyr/sys/atomic.h`: `atomic_t` ist `long`. -->
  <podtype name="atomic_t,atomic_val_t" sign="s" size="4"/>
  <function name="atomic_set">
    <returnValue type="long"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"><not-null/></arg>
    <arg nr="2" direction="in"/>
  </function>
  <function name="atomic_get">
    <returnValue type="long"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>
  <function name="atomic_inc">
    <returnValue type="long"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"><not-null/></arg>
  </function>

  <!-- `zephyr/app_memory/app_memdomain.h`: die Partition und ihr Abschnitt. -->
  <define name="K_APPMEM_PARTITION_DEFINE(name)" value="struct k_mem_partition name"/>
  <define name="K_APP_BMEM(id)" value=""/>

  <!-- `zephyr/devicetree.h` und `zephyr/device.h`: das Geraet, das der
       Devicetree waehlt, ist ein Objekt, das der Bau erzeugt. -->
  <define name="DT_CHOSEN(prop)" value="0"/>
  <define name="DEVICE_DT_GET(node_id)" value="(&amp;__device_dts_ord_0)"/>
  <function name="device_is_ready">
    <returnValue type="bool"/>
    <use-retval/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>

  <!-- `zephyr/drivers/gpio.h`: der Pin eines Knotens (`gpio_dt_spec`, 8.10).
       Den Knoten gibt es hier immer; ob er existiert, prueft erst der Bau
       unter Zephyr. -->
  <podtype name="gpio_flags_t" sign="u" size="4"/>
  <define name="DT_NODELABEL(label)" value="0"/>
  <define name="DT_NODE_HAS_PROP(node_id,prop)" value="1"/>
  <define name="GPIO_DT_SPEC_GET(node_id,prop)" value="{.port = DEVICE_DT_GET(node_id), .pin = 0U, .dt_flags = 0U}"/>
  <define name="GPIO_INPUT" value="(1UL &lt;&lt; 16)"/>
  <define name="GPIO_OUTPUT_ACTIVE" value="((1UL &lt;&lt; 17) | (1UL &lt;&lt; 19) | (1UL &lt;&lt; 20))"/>
  <define name="GPIO_OUTPUT_INACTIVE" value="((1UL &lt;&lt; 17) | (1UL &lt;&lt; 18) | (1UL &lt;&lt; 20))"/>
  <function name="gpio_is_ready_dt">
    <returnValue type="bool"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>
  <function name="gpio_pin_get_dt">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>
  <function name="gpio_pin_set_dt,gpio_pin_configure_dt">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="in"/>
  </function>
  <function name="k_msleep">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"/>
  </function>
  <function name="k_uptime_get">
    <returnValue type="int64_t"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
  </function>

  <!-- `zephyr/drivers/counter.h`: ein Zaehler als Uhr des Ports (FB-733). -->
  <define name="COUNTER_ALARM_CFG_ABSOLUTE" value="(1UL &lt;&lt; 0)"/>
  <define name="COUNTER_ALARM_CFG_EXPIRE_WHEN_LATE" value="(1UL &lt;&lt; 1)"/>
  <define name="COUNTER_GUARD_PERIOD_LATE_TO_SET" value="(1UL &lt;&lt; 0)"/>
  <!-- `errno.h` der C-Bibliothek von Zephyr: ein Alarm, der zu spaet kam. -->
  <define name="ETIME" value="62"/>
  <function name="counter_start">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>
  <function name="counter_get_value">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="out"><not-null/></arg>
  </function>
  <function name="counter_get_top_value,counter_get_frequency">
    <returnValue type="unsigned int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>
  <function name="counter_set_guard_period">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"/>
  </function>
  <function name="counter_set_channel_alarm">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"><not-null/></arg>
  </function>
  <function name="counter_cancel_channel_alarm">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="in"/>
  </function>

  <!-- `zephyr/sys/printk.h`. -->
  <function name="printk">
    <noreturn>false</noreturn>
    <leak-ignore/>
    <formatstr/>
    <arg nr="1" direction="in"><formatstr/><not-null/><strz/></arg>
  </function>
  <function name="snprintk">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="out"><not-null/><minsize type="argvalue" arg="2"/></arg>
    <arg nr="2" direction="in"><valid>0:</valid></arg>
    <formatstr/>
    <arg nr="3" direction="in"><formatstr/><not-null/><strz/></arg>
  </function>

  <!-- `zephyr/drivers/uart.h`: der Betrieb mit Interrupt. -->
  <function name="uart_irq_callback_user_data_set">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"/>
  </function>
  <function name="uart_irq_rx_enable,uart_irq_tx_enable,uart_irq_tx_disable">
    <returnValue type="void"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>
  <function name="uart_irq_update,uart_irq_rx_ready,uart_irq_tx_ready">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>
  <function name="uart_fifo_fill">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="in"><not-null/></arg>
    <arg nr="3" direction="in"><valid>0:</valid></arg>
  </function>
  <function name="uart_fifo_read">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="out"><not-null/></arg>
    <arg nr="3" direction="in"><valid>0:</valid></arg>
  </function>

  <!-- `zephyr/sys/ring_buffer.h`. -->
  <function name="ring_buf_init">
    <returnValue type="void"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="out"><not-null/></arg>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"><not-null/></arg>
  </function>
  <function name="ring_buf_put">
    <returnValue type="unsigned int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"><not-null/></arg>
    <arg nr="2" direction="in"><not-null/></arg>
    <arg nr="3" direction="in"/>
  </function>
  <function name="ring_buf_get_claim">
    <returnValue type="unsigned int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"><not-null/></arg>
    <arg nr="2" direction="out"><not-null/></arg>
    <arg nr="3" direction="in"/>
  </function>
  <function name="ring_buf_get_finish">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"><not-null/></arg>
    <arg nr="2" direction="in"/>
  </function>
  <function name="ring_buf_is_empty">
    <returnValue type="bool"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
  </function>

  <!-- `zephyr/storage/flash_map.h`: die Partition, die der Devicetree
       nennt, als Zahl. -->
  <define name="PARTITION_ID(label)" value="1"/>
  <function name="flash_area_open">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"/>
    <arg nr="2" direction="out"><not-null/></arg>
  </function>
  <function name="flash_area_erase">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"/>
  </function>
  <function name="flash_area_write">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"><not-null/><minsize type="argvalue" arg="4"/></arg>
    <arg nr="4" direction="in"/>
  </function>
  <function name="flash_area_read">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="out"><not-null/><minsize type="argvalue" arg="4"/></arg>
    <arg nr="4" direction="in"/>
  </function>

  <!-- `zephyr/sys/reboot.h`. -->
  <define name="SYS_REBOOT_COLD" value="1"/>
  <function name="sys_reboot">
    <returnValue type="void"/>
    <noreturn>true</noreturn>
    <arg nr="1" direction="in"/>
  </function>

  <!-- `cmsis_os2.h`: Die Aufzaehlungen sind 32 Bit breit (jede hat einen
       Wert 0x7FFFFFFF), ihre Werte stehen mit dem Typ der Aufzaehlung. -->
  <podtype name="osStatus_t,osPriority_t,osThreadState_t" sign="s" size="4"/>
  <define name="osOK" value="(0)"/>
  <define name="osError" value="(-1)"/>
  <define name="osErrorTimeout" value="(-2)"/>
  <define name="osErrorResource" value="(-3)"/>
  <define name="osErrorParameter" value="(-4)"/>
  <define name="osErrorNoMemory" value="(-5)"/>
  <define name="osPriorityLow" value="(8)"/>
  <define name="osPriorityNormal" value="(24)"/>
  <define name="osPriorityHigh" value="(40)"/>
  <define name="osPriorityRealtime7" value="(55)"/>
  <define name="osThreadTerminated" value="(4)"/>
  <define name="osWaitForever" value="0xFFFFFFFFU"/>
  <define name="osThreadJoinable" value="0x00000001U"/>
  <function name="osKernelGetTickCount,osKernelGetTickFreq">
    <returnValue type="unsigned int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
  </function>
  <function name="osSemaphoreNew">
    <returnValue type="void *"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"/>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"/>
  </function>
  <function name="osSemaphoreAcquire">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"/>
    <arg nr="2" direction="in"/>
  </function>
  <function name="osSemaphoreRelease,osSemaphoreDelete,osThreadJoin">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"/>
  </function>
  <function name="osThreadNew">
    <returnValue type="void *"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"><not-null/></arg>
    <arg nr="2" direction="inout"/>
    <arg nr="3" direction="in"/>
  </function>
  <function name="osThreadExit">
    <returnValue type="void"/>
    <noreturn>true</noreturn>
  </function>
  <function name="osThreadGetState">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"/>
  </function>
  <function name="osThreadGetStackSpace">
    <returnValue type="unsigned int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"/>
  </function>
</def>
