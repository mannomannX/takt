<?xml version="1.0"?>
<!-- Was cppcheck fuer die Baue unter ESP-IDF ueber `takt.cfg` hinaus wissen
     muss (plan/cert.md Abschnitt 6, M11 Schritt 21b): Die Koepfe von ESP-IDF
     liest es mit den Aufrufen der Baue, die Kopfpfade der C-Bibliothek nicht.
     Ohne diese Makros bricht es an Koepfen von ESP-IDF und NimBLE ab und
     prueft die Einheit, die sie einbindet, nur halb oder gar nicht:
     `__has_attribute` kennt nur der Uebersetzer, die Listen stehen in
     `sys/queue.h` der C-Bibliothek (wie in BSD). `__atomic_add_fetch`
     zaehlt die Ereignisse der Lasten (main/load_*.c); es ist ein Builtin wie
     die in `takt.cfg`. -->
<def format="2">
  <define name="__has_attribute(x)" value="0"/>
  <define name="SLIST_HEAD(name,type)" value="struct name { struct type *slh_first; }"/>
  <define name="SLIST_ENTRY(type)" value="struct { struct type *sle_next; }"/>
  <define name="STAILQ_HEAD(name,type)" value="struct name { struct type *stqh_first; struct type **stqh_last; }"/>
  <define name="STAILQ_ENTRY(type)" value="struct { struct type *stqe_next; }"/>
  <define name="LIST_HEAD(name,type)" value="struct name { struct type *lh_first; }"/>
  <define name="LIST_ENTRY(type)" value="struct { struct type *le_next; struct type **le_prev; }"/>
  <define name="TAILQ_HEAD(name,type)" value="struct name { struct type *tqh_first; struct type **tqh_last; }"/>
  <define name="TAILQ_ENTRY(type)" value="struct { struct type *tqe_next; struct type **tqe_prev; }"/>
  <function name="__atomic_add_fetch">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"/>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"/>
  </function>
</def>
