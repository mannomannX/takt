<?xml version="1.0"?>
<!-- Was cppcheck fuer den C-Teil von Takt ueber `std.cfg` und `posix.cfg`
     hinaus wissen muss (plan/cert.md Abschnitt 6, M11 Schritt 33b): die
     Builtins von GCC und clang, die der Rahmen ruft, und die POSIX-Namen,
     die `posix.cfg` nicht fuehrt. Ohne sie meldet das MISRA-Addon jeden
     Aufruf als Funktion ohne Deklaration (17.3) und jede Konstante als
     fehlende Konfiguration. Eine Funktion erkennt cppcheck nur mit der
     Zahl ihrer Argumente. -->
<def format="2">
  <!-- Die Speicherordnungen der `__atomic`-Builtins. -->
  <define name="__ATOMIC_RELAXED" value="0"/>
  <define name="__ATOMIC_CONSUME" value="1"/>
  <define name="__ATOMIC_ACQUIRE" value="2"/>
  <define name="__ATOMIC_RELEASE" value="3"/>
  <define name="__ATOMIC_ACQ_REL" value="4"/>
  <define name="__ATOMIC_SEQ_CST" value="5"/>
  <!-- `time.h`, `unistd.h` und `fcntl.h` unter Linux. -->
  <define name="CLOCK_MONOTONIC" value="1"/>
  <define name="STDOUT_FILENO" value="1"/>
  <define name="F_GETFL" value="3"/>
  <define name="F_SETFL" value="4"/>
  <define name="O_NONBLOCK" value="04000"/>
  <!-- Die Builtins; der Wert von `__atomic_*_n` hat den Typ des Objekts. -->
  <function name="__atomic_load_n">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"/>
    <arg nr="2" direction="in"/>
  </function>
  <function name="__atomic_exchange_n">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"/>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"/>
  </function>
  <function name="__atomic_store_n">
    <returnValue type="void"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="out"/>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"/>
  </function>
  <function name="__atomic_signal_fence,__builtin_ia32_ldmxcsr">
    <returnValue type="void"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="in"/>
  </function>
  <function name="__builtin_ia32_stmxcsr">
    <returnValue type="unsigned int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
  </function>
  <function name="__builtin_memcpy">
    <returnValue type="void *"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="out"/>
    <arg nr="2" direction="in"/>
    <arg nr="3" direction="in"/>
  </function>
  <!-- `pthread.h`: was `posix.cfg` nicht kennt. -->
  <function name="pthread_condattr_init,pthread_condattr_destroy">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"/>
  </function>
  <function name="pthread_attr_setinheritsched,pthread_attr_setschedpolicy,pthread_attr_setschedparam,pthread_condattr_setclock,pthread_mutexattr_setprotocol">
    <returnValue type="int"/>
    <noreturn>false</noreturn>
    <leak-ignore/>
    <arg nr="1" direction="inout"/>
    <arg nr="2" direction="in"/>
  </function>
</def>
