# Die Pruefungen des eigenen Codes, die eigene Werkzeuge brauchen (M11
# Schritt 33b und 33c, plan/cert.md Abschnitt 6): der C-Teil mit
# clang-tidy und cppcheck nach CERT C und MISRA C, die Crates mit `unsafe`
# unter Miri. Bei jedem Push, auf main wie auf einem Zweig, und von Hand;
# dazu bei jedem Pull Request auf dem Ergebnis des Merges, denn die Zahlen
# des Katalogs (plan/cert.md) stimmen erst, wenn beide Seiten zusammen sind.
name: Analyse

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  c:
    name: C-Teil nach CERT C und MISRA C
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # clang-tidy kommt mit LLVM 22.1.8 aus der Setup-Aktion.
      - uses: ./.github/actions/setup

      # cppcheck 2.22.0 aus den Quellen, mit Pruefsumme.
      - uses: ./.github/actions/cppcheck

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: analysis

      # Die Lieferformen baut `takt`; die Tests der Pruefung sind ignoriert,
      # weil sie die Werkzeuge brauchen. Die Baue unter Zephyr und ESP-IDF
      # pruefen die Jobs `zephyr` und `esp-idf` von boards.yml nach ihnen.
      - name: Der C-Teil gegen den Katalog
        run: >-
          cargo nextest run -p takt-cli --test c_analysis --run-ignored all --profile ci
          -E 'not test(=the_zephyr_build_deviates_only_as_the_catalog_says)
          and not test(=the_esp_idf_build_deviates_only_as_the_catalog_says)'

  miri:
    name: Miri (${{ matrix.krate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Die Testhilfe von takt-embed liest Programme aus dem Baum.
          - krate: takt-embed
            features: --all-features
            miriflags: -Zmiri-disable-isolation
          - krate: takt-embed-c
            features: ""
            miriflags: ""
          - krate: takt-native-abi
            features: ""
            miriflags: ""
    env:
      # Ein Nightly mit Miri, fest: Ein anderes urteilt anders.
      NIGHTLY: nightly-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nightly mit Miri
        shell: bash
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$NIGHTLY" miri --version
          cargo "+$NIGHTLY" miri setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: miri-${{ matrix.krate }}
          workspaces: crates/${{ matrix.krate }} -> target
      - name: Miri
        shell: bash
        env:
          MIRIFLAGS: ${{ matrix.miriflags }}
        run: cargo "+$NIGHTLY" miri test --manifest-path "crates/${{ matrix.krate }}/Cargo.toml" ${{ matrix.features }}
