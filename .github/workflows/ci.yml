# Die Suite auf Runnern von GitHub (4 Kerne, 16 GB), unter Linux und unter
# Windows: bei jedem Push auf main, fuer Pull Requests und von Hand. Die
# Board-Suiten brauchen Hardware und bleiben lokal (`tools/board-run.ps1`);
# ihre Tests sind `#[ignore]`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keine `concurrency`-Gruppe: Jeder Push bekommt seinen eigenen, vollstaendigen
# Lauf. Eine Gruppe haelt hoechstens einen wartenden Lauf und verwirft die
# dazwischen; so wird kein Push ungeprueft ersetzt. Zu viele Jobs zugleich
# reiht GitHub selbst ein.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: rustfmt und Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust 1.98.0
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: libudev
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libudev-dev pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint-${{ matrix.os }}
          workspaces: |
            . -> target
            crates/takt-embed -> target
            crates/takt-embed-c -> target
            crates/takt-native-abi -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Die Crates mit `unsafe`, die als eigene Workspaces neben dem Haupt-
      # Workspace stehen (plan/cert.md Abschnitt 2); die Board-Crates, das
      # Sprungbrett und die Bring-ups prueft der Job `boards`.
      - name: rustfmt und Clippy der eigenen Workspaces
        shell: bash
        run: |
          for m in crates/takt-embed crates/takt-embed-c crates/takt-native-abi; do
            cargo fmt --manifest-path "$m/Cargo.toml" --check
          done
          cargo clippy --manifest-path crates/takt-embed/Cargo.toml --all-features --all-targets -- -D warnings
          cargo clippy --manifest-path crates/takt-embed-c/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/takt-native-abi/Cargo.toml --features host,ecdsa,rsa,aes-gcm --lib -- -D warnings
          cargo clippy --manifest-path crates/takt-native-abi/Cargo.toml --all-targets -- -D warnings

  # Die Board-Crates, das Sprungbrett und die Bring-ups (M11 Schritt 33a):
  # eigene Workspaces fuer ihre Ziele, neben dem Haupt-Workspace. Die
  # Bring-ups uebersetzen beim Bau ein Takt-Programm (`build.rs`, das aus
  # `takt.toml`) mit dem `takt` aus `target/release`; darum ein gemeinsames
  # Zielverzeichnis und Clippy im Profil `release` wie `tools/embedded.sh`.
  # Jede Form des Ports (12.11) baut das Binary `takt` anders. Jeder Schritt
  # prueft alles und scheitert erst am Ende, mit jedem Befund im Protokoll.
  boards:
    name: rustfmt und Clippy der Board-Crates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Von aussen gilt `.cargo/config.toml` des Bring-ups nicht (FB-449).
      ESP_HAL_CONFIG_USE_RWTEXT_LD_HOOK: "true"
      ESP_HAL_CONFIG_PLACE_SWITCH_TABLES_IN_RAM: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: boards
          workspaces: |
            . -> target
            crates/takt-board-stm32f401 -> ../../target
            crates/takt-board-esp32c6 -> ../../target
            crates/takt-trampoline-stm32f401 -> ../../target
            crates/takt-bringup-host -> ../../target
            crates/takt-bringup-stm32f401 -> ../../target
            crates/takt-bringup-esp32c6 -> ../../target
      - name: rustfmt
        shell: bash
        run: |
          for m in takt-board-stm32f401 takt-board-esp32c6 takt-trampoline-stm32f401 takt-bringup-host \
                   takt-bringup-stm32f401 takt-bringup-esp32c6; do
            cargo fmt --manifest-path "crates/$m/Cargo.toml" --check
          done
      - name: Clippy der Board-Crates und des Sprungbretts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          failed=()
          check() { echo "::group::$*"; cargo clippy "$@" -- -D warnings || failed+=("$*"); echo "::endgroup::"; }
          f401=(--release --target thumbv7em-none-eabihf)
          c6=(--release --target riscv32imac-unknown-none-elf)
          for features in "" embassy; do
            check --manifest-path crates/takt-board-stm32f401/Cargo.toml "${f401[@]}" --features "$features"
            check --manifest-path crates/takt-board-esp32c6/Cargo.toml "${c6[@]}" --features "$features"
          done
          check --manifest-path crates/takt-trampoline-stm32f401/Cargo.toml "${f401[@]}"
          check --manifest-path crates/takt-bringup-host/Cargo.toml --all-targets
          if [ ${#failed[@]} -gt 0 ]; then printf 'gescheitert: %s\n' "${failed[@]}"; exit 1; fi
      - name: takt
        id: takt
        if: ${{ !cancelled() }}
        run: cargo build --release -p takt-cli
      # Die eigene Form mit allen Binaries und dem Messprogramm, dann `takt`
      # in jeder weiteren Form.
      - name: Clippy der Bring-ups
        if: ${{ !cancelled() && steps.takt.outcome == 'success' }}
        shell: bash
        run: |
          failed=()
          check() { echo "::group::$*"; cargo clippy "$@" -- -D warnings || failed+=("$*"); echo "::endgroup::"; }
          f401=(--manifest-path crates/takt-bringup-stm32f401/Cargo.toml --release --target thumbv7em-none-eabihf)
          c6=(--manifest-path crates/takt-bringup-esp32c6/Cargo.toml --release --target riscv32imac-unknown-none-elf)
          check "${f401[@]}" --bins --features bench
          for form in interrupt poll rtic embassy; do
            check "${f401[@]}" --bin takt --features "$form"
          done
          check "${c6[@]}" --bins --features bench
          for form in interrupt embassy; do
            check "${c6[@]}" --bin takt --features "$form"
          done
          if [ ${#failed[@]} -gt 0 ]; then printf 'gescheitert: %s\n' "${failed[@]}"; exit 1; fi

  test:
    name: Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.os }}
      # Tests bauen eigene Workspaces mit `--offline` (embed_cmd, die Harness
      # des Wirts); ihre Abhaengigkeiten holt das, was lokal der Cache traegt.
      - name: Abhaengigkeiten der eigenen Workspaces
        shell: bash
        run: |
          for m in examples/rust-host crates/takt-embed crates/takt-embed-c crates/takt-native-abi crates/takt-bringup-host; do
            cargo fetch --manifest-path "$m/Cargo.toml"
          done
      - run: cargo nextest run --workspace --profile ci
