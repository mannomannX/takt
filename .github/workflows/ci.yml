# Die Suite auf einem Runner von GitHub (ubuntu-24.04, 4 Kerne, 16 GB): bei
# jedem Push auf main, fuer Pull Requests und von Hand. Die Board-Suiten
# brauchen Hardware und bleiben lokal (`tools/board-run.ps1`); ihre Tests
# sind `#[ignore]`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: rustfmt und Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.98.0 und libudev
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: cargo nextest run --workspace --profile ci
