# Der erschoepfende Lauf von libtaktm (INT-028) auf einem Runner von GitHub,
# von Hand gestartet: jede f32-Eingabe der zehn Funktionen gegen das Orakel,
# rund eine Stunde auf vier Kernen. Er traegt den Fingerabdruck der
# Implementierung in `crates/libtaktm/tests/exhaustive_runs.txt` ein; die
# Datei kommt als Artefakt zurueck und wird von Hand committet, wie lokal.
name: Erschoepfender Lauf

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Zweig oder Commit
        required: true
        default: main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  exhaustive:
    name: libtaktm, jede f32-Eingabe
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: exhaustive
      - run: cargo test -p libtaktm --release --test exhaustive -- --ignored --test-threads=1
      - name: Ratsche sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exhaustive-runs
          path: crates/libtaktm/tests/exhaustive_runs.txt
          retention-days: 30
