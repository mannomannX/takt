# Die Einordnung der unerreichten Pruefstellen (FB-511) und das Neuerzeugen
# der Pfade und Beweisdateien des Solvers auf Runnern von GitHub, von Hand
# gestartet. Lokal sprengte z3 neben anderen Projekten den Speicher; hier
# hat jeder Job 16 GB.
#
# `art: einordnen`: Der Test `the_stored_solver_paths_still_hold`
# (takt-conformance, solver_paths.rs) ordnet unter `CLASSIFY_UNREACHED` die
# offenen Programme ein (`CLASSIFY_WHAT`: Stellen ohne Fault, Uebergaenge,
# Bestehen); `CLASSIFY_SHARD=i/n` gibt jedem Job jedes n-te. Ein
# Sammeljob fuehrt die TSV je Tiefe und die Antworten des Solvers zusammen.
#
# `art: pfade`: derselbe Test unter `UPDATE_PATHS` (M11 Strang B2, Schritt
# 3): die Programme aus `programs`, ohne sie alle; das Artefakt `pfade`
# traegt `corpus-try/paths`, wie der Lauf es hinterliess.
name: Solver-Einordnung

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Zweig oder Commit, der eingeordnet wird
        required: true
        default: main
      art:
        description: Einordnen (CLASSIFY_UNREACHED) oder Pfade neu erzeugen (UPDATE_PATHS)
        type: choice
        options: [einordnen, pfade]
        default: einordnen
      depths:
        description: Tiefen (CLASSIFY_UNREACHED)
        required: true
        default: "10,20"
      shards:
        description: Zahl der Jobs
        required: true
        default: "8"
      memory_mb:
        description: Speichergrenze je z3 in MB (CLASSIFY_MEMORY_MB)
        required: true
        default: "6144"
      workers:
        description: Faeden je Job (CLASSIFY_WORKERS); Grenze mal Faeden bleibt unter 14 GB
        required: true
        default: "2"
      programs:
        description: Optional nur diese Programme (CLASSIFY_PROGRAMS bzw. UPDATE_PATHS, durch Komma getrennt)
        required: false
        default: ""
      what:
        description: Was eingeordnet wird (CLASSIFY_WHAT; stellen, uebergaenge, bestehen)
        required: true
        default: "stellen,uebergaenge,bestehen"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: Teile
    if: inputs.art == 'einordnen'
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - id: shards
        env:
          N: ${{ inputs.shards }}
        run: |
          case "$N" in ''|*[!0-9]*) echo "shards ist keine Zahl: $N"; exit 1;; esac
          echo "list=$(python3 -c "import json, os; print(json.dumps(list(range(int(os.environ['N'])))))")" >> "$GITHUB_OUTPUT"

  classify:
    name: Teil ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # Die Setup-Aktion kommt von main, der eingeordnete Stand nach `src`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src -> target
          shared-key: solver
      - name: Einordnen
        working-directory: src
        env:
          CLASSIFY_UNREACHED: ${{ inputs.depths }}
          CLASSIFY_SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
          CLASSIFY_MEMORY_MB: ${{ inputs.memory_mb }}
          CLASSIFY_WORKERS: ${{ inputs.workers }}
          CLASSIFY_PROGRAMS_INPUT: ${{ inputs.programs }}
          CLASSIFY_WHAT: ${{ inputs.what }}
        run: |
          if [ -n "$CLASSIFY_PROGRAMS_INPUT" ]; then export CLASSIFY_PROGRAMS="$CLASSIFY_PROGRAMS_INPUT"; fi
          cargo test --release -p takt-conformance --test solver_paths -- --nocapture
      - name: Ergebnisse sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fb511-teil-${{ matrix.shard }}
          path: |
            src/target/tmp/fb511-*.tsv
            src/target/tmp/solver-cache/
          if-no-files-found: warn
          retention-days: 30

  collect:
    name: Zusammenfuehren
    needs: classify
    if: always() && inputs.art == 'einordnen'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fb511-teil-*
          path: teile
      - name: Je Tiefe eine Datei, ein Cache
        run: |
          mkdir -p ergebnis/solver-cache
          for f in teile/*/fb511-*-s*von*.tsv; do
            [ -e "$f" ] || continue
            case "$f" in *.laufend.tsv) continue;; esac
            tiefe=$(basename "$f" | sed -E 's/^fb511-([0-9]+)-s.*/\1/')
            cat "$f" >> "ergebnis/fb511-$tiefe.unsortiert.tsv"
          done
          for f in ergebnis/fb511-*.unsortiert.tsv; do
            [ -e "$f" ] || continue
            sort "$f" > "${f%.unsortiert.tsv}.tsv"
            rm "$f"
          done
          find teile -path '*/solver-cache/*' -type f -exec cp -n {} ergebnis/solver-cache/ \;
          for f in ergebnis/fb511-*.tsv; do
            [ -e "$f" ] || continue
            echo "== $f: $(wc -l < "$f") Stellen"
            cut -f6 "$f" | sort | uniq -c | sort -rn
          done | tee ergebnis/uebersicht.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fb511-ergebnis
          path: ergebnis/
          retention-days: 90

  paths:
    name: Pfade neu
    if: inputs.art == 'pfade'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src -> target
          shared-key: solver
      - name: Pfade und Beweisdateien
        working-directory: src
        env:
          UPDATE_PATHS: ${{ inputs.programs || '1' }}
        run: cargo test --release -p takt-conformance --test solver_paths -- --nocapture the_stored_solver_paths_still_hold
      - name: Ergebnis sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pfade
          path: src/corpus-try/paths/
          if-no-files-found: error
          retention-days: 30
