# Die Abbilder der Board-Suiten auf Runnern von GitHub, von Hand gestartet
# (M11 Schritt 34d). Lokal passten Release-Bau und Bring-ups nicht mehr neben
# andere Projekte; hier hat jeder Job 16 GB.
#
# Je Board laufen dessen Tests mit `TAKT_BOARD_BUILD_ONLY=1`: Jeder baut die
# Abbilder, die er am Board braeuchte, und endet vor dem Schreiben. Der
# Zwischenspeicher `target/takt-board-images` kommt als Artefakt zurueck,
# mit einer Datei, die Commit und Stand nennt; `tools/board-run.ps1 -FromCi
# <lauf>` laedt ihn und flasht und prueft nur noch. Stand und Schluessel
# haengen nur an Inhalten, also findet der Lauf unter Windows die Abbilder
# aus Linux wieder, wenn Quellen, rustc und clang dieselben sind.
#
# Dazu die Board-Suiten selbst als nextest-Archiv, gebaut unter Windows wie
# der Rechner am Board (M11 Schritt 34e): Mit beidem laeuft dort kein
# Compiler mehr. Die Quellen nennt am Board `TAKT_ROOT`
# (`takt_conformance::repo_root`), denn ein Pfad aus `env!` waere der des
# Runners.
#
# Die Abbilder unter Zephyr baut derselbe Lauf mit (M11 Schritt 19, FB-731):
# Mit Zephyr und seinem SDK (`.github/actions/zephyr`) bauen die Zephyr-Tests
# der Suiten ihre Abbilder in denselben Zwischenspeicher
# (`takt_conformance::zephyr::image`). Bei einem Push, der Adapter, Beispiele
# oder Modul unter Zephyr aendert, und im Pull Request dazu laeuft nur der Job
# `zephyr`: Er baut alle Beispiele fuer beide Boards mit den Pruefungen aus
# `zephyr_example.rs` und faehrt clang-tidy ueber ihre `compile_commands.json`
# gegen den Katalog des C-Teils (plan/cert.md).
name: Board-Abbilder

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Zweig oder Commit; leer heisst der Stand, von dem aus gestartet wird
        required: false
        default: ""
  push:
    paths:
      - "crates/takt-embed-c/ports/zephyr*/**"
      - "crates/takt-embed-c/ports/cmsis-rtos2/**"
      - "examples/zephyr*/**"
      - "examples/cmsis-rtos2/**"
      - "zephyr/**"
      - "tools/cmake/**"
      - "tools/c-analysis/zephyr.cfg"
      - "crates/takt-cli/tests/zephyr_example.rs"
      - "crates/takt-cli/tests/c_analysis.rs"
      - "plan/cert.md"
      - ".github/actions/zephyr/**"
      - ".github/workflows/boards.yml"

  # Der Pull Request eines Merge-Antrags zeigt den Job `zephyr` mit (plan/m11-strands.md,
  # Ablauf je Punkt 7).
  pull_request:
    paths:
      - "crates/takt-embed-c/ports/zephyr*/**"
      - "crates/takt-embed-c/ports/cmsis-rtos2/**"
      - "examples/zephyr*/**"
      - "examples/cmsis-rtos2/**"
      - "zephyr/**"
      - "tools/cmake/**"
      - "tools/c-analysis/zephyr.cfg"
      - "crates/takt-cli/tests/zephyr_example.rs"
      - "crates/takt-cli/tests/c_analysis.rs"
      - "plan/cert.md"
      - ".github/actions/zephyr/**"
      - ".github/workflows/boards.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  zephyr:
    name: Zephyr
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/zephyr
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: zephyr
      # Die Beispiele bauen und pruefen; die Baue bleiben in `target/tmp`
      # fuer clang-tidy liegen.
      - name: Die Beispiele unter Zephyr
        run: cargo nextest run -p takt-cli --test zephyr_example --run-ignored all --no-fail-fast --profile ci
      - name: clang-tidy ueber die Baue gegen den Katalog
        run: >-
          cargo nextest run -p takt-cli --test c_analysis --run-ignored all --profile ci
          -E 'test(=the_zephyr_build_deviates_only_as_the_catalog_says)'

  images:
    name: Abbilder ${{ matrix.board }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        board: [esp32c6, stm32f401]
    steps:
      # Werkzeuge und Quellen vom selben Stand: Die Setup-Aktion legt fest,
      # mit welchem rustc und clang gebaut wird, und beide gehen in den Stand.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
      # Die Zephyr-Tests der Suite bauen ihre Abbilder mit west.
      - uses: ./.github/actions/zephyr
      # Nur die Registry: Ein Cache des Zielverzeichnisses truege den
      # Zwischenspeicher der Abbilder mit.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: boards
          cache-targets: "false"
      # Die Bring-ups bauen mit dem Werkzeug aus `target/release` (FB-193).
      - name: takt
        run: cargo build --release -p takt-cli
      # Wie `tools/board-run.ps1`: Die Bruecke an UART0 des C6 darf fehlen.
      - name: Abbilder bauen
        env:
          TAKT_BOARD_BUILD_ONLY: "1"
          TAKT_ALLOW_MISSING: uart-bridge
        run: >-
          cargo nextest run -p takt-conformance --test board_${{ matrix.board }}
          --run-ignored all --no-fail-fast --profile ci
      # Die Abbilder des Bench (13.8) ebenso: `takt bench` baut jedes und endet
      # vor dem Board (`tools/board-run.ps1 -FromCi … -Bench`).
      - name: Bench-Abbilder bauen
        env:
          TAKT_BOARD_BUILD_ONLY: "1"
        run: target/release/takt bench --board ${{ matrix.board }}
      - name: Stand nennen
        if: always()
        shell: bash
        run: |
          images=target/takt-board-images
          mkdir -p "$images"
          {
            echo "board ${{ matrix.board }}"
            echo "commit $(git rev-parse HEAD)"
            for stand in "$images"/*/; do
              [ -d "$stand" ] || continue
              echo "stand $(basename "$stand") $(find "$stand" -name '*.elf' | wc -l) elf"
            done
            echo "gebaut $(cat "$images/misses.log" 2>/dev/null | wc -l)"
          } | tee "$images/stand-${{ matrix.board }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: board-images-${{ matrix.board }}
          path: target/takt-board-images/
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Board-Suiten als Archiv
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: board-tests
      - name: Archiv bauen
        shell: bash
        run: >-
          cargo nextest archive -p takt-conformance --test board_esp32c6 --test board_stm32f401
          --archive-file target/board-tests.tar.zst
      # `takt bench` am Board, mit den Abbildern aus `images`.
      - name: takt
        run: cargo build --release -p takt-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: board-tests-windows
          path: |
            target/board-tests.tar.zst
            target/release/takt.exe
          if-no-files-found: error
          retention-days: 14
