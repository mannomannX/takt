name: Takt-Werkzeuge
description: >-
  Rust 1.98.0 mit den Zielen der Boards und llvm-tools, LLVM 22, die
  aarch64-Werkzeugkette mit qemu (wie tools/Dockerfile.linux), z3 4.13.4 und
  cvc5 1.2.0 (wie unter ~/.takt/bin auf dem Entwicklungsrechner) und
  cargo-nextest.

runs:
  using: composite
  steps:
    # Die Suite braucht mehr Platte, als der Runner frei hat; die
    # vorinstallierten SDKs braucht Takt nicht.
    - name: Platz auf der Platte
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Rust 1.98.0
      shell: bash
      run: |
        rustup toolchain install 1.98.0 --profile minimal \
          --component clippy,rustfmt,llvm-tools \
          --target thumbv7em-none-eabihf,riscv32imac-unknown-none-elf,aarch64-unknown-linux-gnu
        rustup default 1.98.0

    # LLVM in derselben Hauptversion wie auf dem Wirt: Der Codegen schreibt
    # IR fuer 22 (tools/Dockerfile.linux, KON2-013).
    # `libudev` fuer `serialport` (takt-trace-serial, die Board-Harness).
    - name: LLVM 22, aarch64, qemu und libudev
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user libudev-dev pkg-config
        wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
        sudo bash /tmp/llvm.sh 22
        sudo apt-get install -y -qq --no-install-recommends llvm-22
        echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
        {
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64
          echo QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
        } >> "$GITHUB_ENV"

    # Dieselben Versionen wie auf dem Entwicklungsrechner: Der Cache der
    # Solver-Antworten haengt an Name und Version (takt-prove).
    - name: z3 4.13.4 und cvc5 1.2.0
      shell: bash
      run: |
        mkdir -p "$HOME/.takt/bin"
        cd "$RUNNER_TEMP"
        wget -q https://github.com/Z3Prover/z3/releases/download/z3-4.13.4/z3-4.13.4-x64-glibc-2.35.zip
        unzip -q z3-4.13.4-x64-glibc-2.35.zip
        find z3-4.13.4-x64-glibc-2.35/bin -maxdepth 1 -type f -exec cp {} "$HOME/.takt/bin/" \;
        wget -q https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.0/cvc5-Linux-x86_64-static.zip
        unzip -q cvc5-Linux-x86_64-static.zip
        cp cvc5-Linux-x86_64-static/bin/cvc5 "$HOME/.takt/bin/"
        echo "$HOME/.takt/bin" >> "$GITHUB_PATH"
        "$HOME/.takt/bin/z3" --version
        "$HOME/.takt/bin/cvc5" --version | head -1

    - name: cargo-nextest
      shell: bash
      run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
