name: Takt-Werkzeuge
description: >-
  Rust 1.98.0 mit den Zielen der Boards und llvm-tools, LLVM 22.1.8 (unter Linux
  mit clang-tidy fuer den C-Teil), z3 4.13.4,
  cvc5 1.2.0 und cargo-nextest 0.9.146, dieselben Versionen wie auf dem
  Entwicklungsrechner. Unter Linux dazu die aarch64-Werkzeugkette mit qemu
  und libudev (wie tools/Dockerfile.linux).

# Die Pruefsummen sind beim Einrichten (2026-10-12) gerechnet, die von LLVM
# veroeffentlicht GitHub: Ein ausgetauschter Solver urteilte unbemerkt, ein
# ausgetauschter clang uebersetzte unbemerkt anders.

runs:
  using: composite
  steps:
    - name: Rust 1.98.0
      shell: bash
      run: |
        rustup toolchain install 1.98.0 --profile minimal \
          --component clippy,rustfmt,llvm-tools \
          --target thumbv7em-none-eabihf,riscv32imac-unknown-none-elf,aarch64-unknown-linux-gnu
        rustup default 1.98.0

    # --- Linux ---------------------------------------------------------------

    # Die Suite braucht mehr Platte, als der Runner frei hat; die
    # vorinstallierten SDKs braucht Takt nicht.
    - name: Platz auf der Platte
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /

    # `libudev` fuer `serialport` (takt-trace-serial, die Board-Harness).
    - name: aarch64, qemu und libudev
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user libudev-dev pkg-config
        {
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64
          echo QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
        } >> "$GITHUB_ENV"

    # LLVM 22.1.8 wie auf dem Entwicklungsrechner, aus dem Archiv des
    # Projekts: Ein Abbild, das ein Runner baut, findet der lokale Lauf nur
    # mit derselben Version von clang wieder (M11 Schritt 34d). Das Archiv
    # hat 1,9 GB; der Cache haelt nur, was Takt braucht: clang mit seinen
    # Kopfdateien und Laufzeiten (ASan), die Werkzeuge, die Takt neben clang
    # sucht (`ld.lld`, `llvm-ar`, `llvm-nm`, `llvm-size`, `clang-tidy` fuer
    # den C-Teil, M11 Schritt 33b), und die Bibliotheken, die sie laden.
    - name: LLVM 22.1.8 aus dem Cache
      id: llvm
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ~/llvm-22.1.8
        key: llvm-22.1.8-linux-x64-3

    - name: LLVM 22.1.8 laden
      if: runner.os == 'Linux' && steps.llvm.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        name=LLVM-22.1.8-Linux-X64
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$name.tar.xz" \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$name.tar.xz"
        echo "df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384  $name.tar.xz" | sha256sum -c -
        tar -xJf "$name.tar.xz" --wildcards "$name/bin/*" "$name/lib/clang/*" "$name/lib/*.so*"
        rm "$name.tar.xz"
        dest="$HOME/llvm-22.1.8"
        mkdir -p "$dest/bin" "$dest/lib"
        # Je Werkzeug die Datei selbst, nicht der Verweis: Der Name waehlt,
        # was `clang` und `lld` sind (`ld.lld` ist der ELF-Linker).
        tools="$name/bin/clang $name/bin/ld.lld $name/bin/llvm-ar $name/bin/llvm-nm $name/bin/llvm-size $name/bin/clang-tidy"
        for tool in $tools; do
          cp -L "$tool" "$dest/bin/"
        done
        # Die Bibliotheken aus dem Archiv, die sie laden; `$ORIGIN/../lib`
        # findet sie neben `bin` wieder.
        for lib in $(ldd $tools | awk -v tree="$name/" 'index($3, tree) { print $3 }' | sort -u); do
          cp -L "$lib" "$dest/lib/"
        done
        # Kopfdateien und Laufzeiten, die clang neben sich erwartet.
        cp -r "$name/lib/clang" "$dest/lib/"
        rm -rf "$name"
        ls -la "$dest/bin" "$dest/lib"
        du -sh "$dest"

    - name: LLVM 22.1.8 einrichten
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "$HOME/llvm-22.1.8/bin" >> "$GITHUB_PATH"
        echo "TAKT_CLANG=$HOME/llvm-22.1.8/bin/clang" >> "$GITHUB_ENV"
        "$HOME/llvm-22.1.8/bin/clang" --version
        "$HOME/llvm-22.1.8/bin/ld.lld" --version
        "$HOME/llvm-22.1.8/bin/llvm-ar" --version | head -2
        "$HOME/llvm-22.1.8/bin/llvm-nm" --version
        "$HOME/llvm-22.1.8/bin/llvm-size" --version
        "$HOME/llvm-22.1.8/bin/clang-tidy" --version

    - name: z3 4.13.4 und cvc5 1.2.0
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p "$HOME/.takt/bin"
        cd "$RUNNER_TEMP"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -O \
          https://github.com/Z3Prover/z3/releases/download/z3-4.13.4/z3-4.13.4-x64-glibc-2.35.zip
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -O \
          https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.0/cvc5-Linux-x86_64-static.zip
        sha256sum -c - <<'SUMS'
        93f91f9c6f4a00a041c19fc7a74adc1f441c8244ce70d486e19abcd89c6a014b  z3-4.13.4-x64-glibc-2.35.zip
        d18f174ff9a11923c32c3f871f844ed16bd77a28f51050b8e7c8d821c98a1c2e  cvc5-Linux-x86_64-static.zip
        SUMS
        unzip -q z3-4.13.4-x64-glibc-2.35.zip
        find z3-4.13.4-x64-glibc-2.35/bin -maxdepth 1 -type f -exec cp {} "$HOME/.takt/bin/" \;
        unzip -q cvc5-Linux-x86_64-static.zip
        cp cvc5-Linux-x86_64-static/bin/cvc5 "$HOME/.takt/bin/"
        echo "$HOME/.takt/bin" >> "$GITHUB_PATH"
        "$HOME/.takt/bin/z3" --version
        "$HOME/.takt/bin/cvc5" --version | head -1

    - name: cargo-nextest 0.9.146
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        curl -LsSf --retry 5 --retry-all-errors --retry-delay 10 -o nextest.tar.gz https://get.nexte.st/0.9.146/linux
        echo "682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428  nextest.tar.gz" | sha256sum -c -
        tar zxf nextest.tar.gz -C "${CARGO_HOME:-$HOME/.cargo}/bin"

    # --- Windows -------------------------------------------------------------

    # Das LLVM des Runners ist aelter; 22.1.8 wie auf dem Entwicklungsrechner,
    # und `TAKT_CLANG` nennt es, damit kein anderes clang gewinnt.
    - name: LLVM 22.1.8
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-win64.exe'
        Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 10 -OutFile $installer `
          -Uri https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe
        $want = '16E5709785FEF73C854646241C4A92C5CD574318D1B33C63330DD7721903E55C'
        if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $want) { throw "Pruefsumme von LLVM passt nicht" }
        Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\LLVM22' -Wait
        'C:\LLVM22\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        'TAKT_CLANG=C:\LLVM22\bin\clang.exe' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        & C:\LLVM22\bin\clang.exe --version

    - name: z3 4.13.4 und cvc5 1.2.0
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $bin = Join-Path $env:USERPROFILE '.takt\bin'
        New-Item -ItemType Directory -Force $bin | Out-Null
        Set-Location $env:RUNNER_TEMP
        $files = @{
          'z3-4.13.4-x64-win.zip' = @('https://github.com/Z3Prover/z3/releases/download/z3-4.13.4/z3-4.13.4-x64-win.zip', '0A36DD5654FE423D23A727C4570C9DB9A315926A4301189B868B6EB9BFD5979D')
          'cvc5-Win64-x86_64-static.zip' = @('https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.0/cvc5-Win64-x86_64-static.zip', '256F4AF3F4181E770801DF436852CB3C76C86DBF9B69A47064D7F8D5BC0EE1D2')
        }
        foreach ($name in $files.Keys) {
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 10 -Uri $files[$name][0] -OutFile $name
          if ((Get-FileHash $name -Algorithm SHA256).Hash -ne $files[$name][1]) { throw "Pruefsumme von $name passt nicht" }
          Expand-Archive $name -DestinationPath . -Force
        }
        Copy-Item z3-4.13.4-x64-win\bin\z3.exe, z3-4.13.4-x64-win\bin\libz3.dll $bin
        Copy-Item cvc5-Win64-x86_64-static\bin\cvc5.exe $bin
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        & (Join-Path $bin 'z3.exe') --version
        & (Join-Path $bin 'cvc5.exe') --version | Select-Object -First 1

    - name: cargo-nextest 0.9.146
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'nextest.zip'
        Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 10 -Uri https://get.nexte.st/0.9.146/windows -OutFile $zip
        if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '0FA689815C8157E4633225B6B173184B3D546EB6FFB754C3D0E6EA5973284A20') { throw "Pruefsumme von nextest passt nicht" }
        $cargoBin = if ($env:CARGO_HOME) { Join-Path $env:CARGO_HOME 'bin' } else { Join-Path $env:USERPROFILE '.cargo\bin' }
        Expand-Archive $zip -DestinationPath $cargoBin -Force
        cargo nextest --version
