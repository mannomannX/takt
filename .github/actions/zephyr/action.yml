name: Zephyr
description: >-
  Zephyr v4.5.0-rc2 (Commit c136c73d) mit den Modulen cmsis, cmsis_6,
  hal_stm32 und hal_espressif, das Zephyr-SDK 1.0.1 mit arm-zephyr-eabi und
  riscv64-zephyr-elf, west und gperf: dieselben Fassungen wie in
  D:\takt-tools (M11 Schritt 19, FB-731). v4.5.0-rc2 statt v4.4.2 wegen des
  Zeitgebers des ESP32-C6 (FB-781); auf v4.5.0, sobald sie erscheint.
  Setzt TAKT_WEST, ZEPHYR_BASE, ZEPHYR_SDK_INSTALL_DIR und
  ZEPHYR_TOOLCHAIN_VARIANT, wie activate.ps1 es dort tut.

# Arbeitsbereich und SDK liegen im Cache, flach geklont und ohne die
# uebrigen Toolchains des SDK. Die Python-Umgebung nicht: Sie haengt am
# Python des Runners und entsteht in jedem Lauf neu. Die Pruefsummen des
# SDK stehen in seiner `sha256.sum` (sdk-ng v1.0.1), die der Python-Pakete
# in tools/ci/zephyr-requirements.txt (FB-738); geladen wird nur ueber HTTPS.

runs:
  using: composite
  steps:
    # gperf fuer `CONFIG_USERSPACE` (examples/zephyr), Ninja fuer west.
    - name: gperf und Ninja
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends gperf ninja-build

    - name: Zephyr aus dem Cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/zephyrproject
          ~/zephyr-sdk-1.0.1
        key: zephyr-v4.5.0-rc2-c136c73d-sdk-1.0.1-linux-x64-1

    # west, was der Bau importiert, und esptool fuer den C6: jedes Paket
    # mit Fassung und Pruefsumme aus der Sperrdatei, auch die mittelbaren.
    - name: west und die Python-Pakete
      shell: bash
      run: |
        python3 -m venv "$HOME/zephyr-venv"
        "$HOME/zephyr-venv/bin/pip" install -q --require-hashes -r "$GITHUB_WORKSPACE/tools/ci/zephyr-requirements.txt"

    - name: Zephyr v4.5.0-rc2 laden
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        west="$HOME/zephyr-venv/bin/west"
        "$west" init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.5.0-rc2 "$HOME/zephyrproject"
        # Festgelegt ist der Commit, nicht der Tag: v4.5.0-rc2 zeigt auf
        # diesen, wie in D:\takt-tools; ein verschobener Tag bricht hier ab.
        # Die Module legt sein west.yml je auf einen Commit fest.
        test "$(git -C "$HOME/zephyrproject/zephyr" rev-parse HEAD)" = c136c73d7be3305d2c07ee5726d4c6d0d985068b
        cd "$HOME/zephyrproject"
        "$west" config manifest.project-filter -- '-.*,+cmsis,+cmsis_6,+hal_stm32,+hal_espressif'
        "$west" update --narrow -o=--depth=1
        du -sh "$HOME/zephyrproject"

    - name: Zephyr-SDK 1.0.1 laden
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        base=https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1
        for name in zephyr-sdk-1.0.1_linux-x86_64_minimal.tar.xz \
          toolchain_gnu_linux-x86_64_arm-zephyr-eabi.tar.xz toolchain_gnu_linux-x86_64_riscv64-zephyr-elf.tar.xz; do
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$name" "$base/$name"
        done
        sha256sum -c - <<'SUMS'
        ca9bc0ff66fafca1dac9d592a36d953cf16d096a9d09b1c0357f021cf9f6a7eb  zephyr-sdk-1.0.1_linux-x86_64_minimal.tar.xz
        21b85981cb5a1818d9bc53d82af80f208946ec038b982ff1907287572ed3a634  toolchain_gnu_linux-x86_64_arm-zephyr-eabi.tar.xz
        01750834c471fbdb335c1b8b8aee17010a1968938957db85640c366235771a38  toolchain_gnu_linux-x86_64_riscv64-zephyr-elf.tar.xz
        SUMS
        tar -xJf zephyr-sdk-1.0.1_linux-x86_64_minimal.tar.xz -C "$HOME"
        mkdir -p "$HOME/zephyr-sdk-1.0.1/gnu"
        for toolchain in arm-zephyr-eabi riscv64-zephyr-elf; do
          tar -xJf "toolchain_gnu_linux-x86_64_$toolchain.tar.xz" -C "$HOME/zephyr-sdk-1.0.1/gnu"
        done
        rm ./*.tar.xz
        ls "$HOME/zephyr-sdk-1.0.1" "$HOME/zephyr-sdk-1.0.1/gnu"
        du -sh "$HOME/zephyr-sdk-1.0.1"

    - name: Zephyr freischalten
      shell: bash
      run: |
        {
          echo "TAKT_WEST=$HOME/zephyr-venv/bin/west"
          echo "ZEPHYR_BASE=$HOME/zephyrproject/zephyr"
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-1.0.1"
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr"
        } >> "$GITHUB_ENV"
        echo "$HOME/zephyr-venv/bin" >> "$GITHUB_PATH"
        "$HOME/zephyr-venv/bin/west" --version
        "$HOME/zephyr-sdk-1.0.1/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc" --version | head -1
        "$HOME/zephyr-sdk-1.0.1/gnu/riscv64-zephyr-elf/bin/riscv64-zephyr-elf-gcc" --version | head -1
