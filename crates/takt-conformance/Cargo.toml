[package]
name = "takt-conformance"
version = "0.1.0"
description = "Takt: differentielles Testen, Interpreter gegen erzeugten Code (Referenz 13.8)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
takt-diag = { path = "../takt-diag" }
# Der Rahmen der Boards und die Bausteine des Wirtsrahmens.
takt-frame = { path = "../takt-frame" }
# Treiber je Kanal und `MAXPT` fuer den Rand der Rahmen (12.6).
takt-hal = { path = "../takt-hal" }
takt-interp = { path = "../takt-interp" }
takt-llvm = { path = "../takt-llvm" }
takt-native = { path = "../takt-native" }
takt-crypto = { path = "../takt-crypto", features = ["ecdsa", "rsa", "aes-gcm"] }
takt-mir = { path = "../takt-mir" }
takt-sema = { path = "../takt-sema" }
# Die Boards am Host (`board`): der Trace kommt ueber USB-Serial-JTAG
# (ESP32-C6) oder einen Adapter an USART1 (STM32F401).
serialport = { version = "4", default-features = false, optional = true }

[dev-dependencies]
# Ein fehlendes Werkzeug ist ein Fehler, kein Bestehen (FB-392).
takt-testkit = { path = "../takt-testkit" }
# Die Faehigkeitsmatrix haelt die Tabelle des Beweisers gegen seine Kodierung (Schritt 25).
takt-prove = { path = "../takt-prove" }
# Die Folge des Pruefgeraets, das der Bring-up fuer den Treiberrand stellt.
takt-board-support = { path = "../takt-board-support" }

[features]
# Die Bring-ups binden nur den C-Rahmen (`mcu`) in ihr Bauskript und
# lassen die Boards am Host mitsamt der seriellen Schnittstelle weg.
default = ["board"]
board = ["dep:serialport"]

[lints]
workspace = true
