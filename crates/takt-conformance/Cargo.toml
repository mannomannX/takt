[package]
name = "takt-conformance"
version = "0.1.0"
description = "Takt: differentielles Testen, Interpreter gegen erzeugten Code (Referenz 13.8)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
takt-diag = { path = "../takt-diag" }
takt-interp = { path = "../takt-interp" }
takt-llvm = { path = "../takt-llvm" }
takt-native = { path = "../takt-native" }
takt-mir = { path = "../takt-mir" }
takt-sema = { path = "../takt-sema" }
# Die Boards am Host (`board`): der Trace kommt ueber USB-Serial-JTAG
# (ESP32-C6) oder einen Adapter an USART1 (STM32F401).
serialport = { version = "4", default-features = false, optional = true }

[features]
# Die Bring-ups binden nur den C-Rahmen (`mcu`) in ihr Bauskript und
# lassen die Boards am Host mitsamt der seriellen Schnittstelle weg.
default = ["board"]
board = ["dep:serialport"]

[lints]
workspace = true
