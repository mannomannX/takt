[package]
name = "takt-mir"
version = "0.1.0"
description = "Takt: mittlere IR (typisiert, entzuckert), Desugaring 6.2, Format TAKT-MIR, Logik-Hash"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
takt-diag = { path = "../takt-diag" }
# Die Gestalt eines Typs fuer den Leser der TCB (`bytes::shape`).
takt-native = { path = "../takt-native" }

[dev-dependencies]
# Die Rundreise jedes Korpusprogramms durch das Format (SYN-029) braucht
# die Programme als MIR.
takt-sema = { path = "../takt-sema" }

[lints]
workspace = true
