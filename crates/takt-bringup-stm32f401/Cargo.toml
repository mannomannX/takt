[package]
name = "takt-bringup-stm32f401"
version = "0.1.0"
description = "Takt: Bring-up-Programm fuer die Black Pill — Tick, LED, Telemetrie"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Eigener Workspace wie das Board-Crate: Ein ausfuehrbares `no_std`-Programm
# braucht `unsafe` (Interrupt-Handler, Registerzugriff), und `forbid` (13.4)
# laesst sich nicht lokal aufheben. Siehe `takt-board-stm32f401`.
[workspace]

# Der Bau bindet das Takt-Programm wie jeder Wirt (12.11): `takt-embed`
# ruft `takt build --emit embed`, `takt-conformance` stellt Werkzeug und
# Pruefstand (`bringup`), `takt-llvm` Praefix und Flags. Sie laufen auf dem
# *Wirt*, nicht auf dem Ziel — darum `build-dependencies` und nicht
# `dependencies`.
[build-dependencies]
# Der Schluessel des Baus im ELF (KON1-009).
takt-board-support = { path = "../takt-board-support" }
takt-conformance = { path = "../takt-conformance", default-features = false }
takt-embed = { path = "../takt-embed", features = ["build"] }
takt-llvm = { path = "../takt-llvm" }

[dependencies]
# Fuer das Messprogramm `natives` (13.8): die kuratierten Natives und ihre
# Einstiege, wie der erzeugte Code sie ruft.
takt-native = { path = "../takt-native" }
takt-native-abi = { path = "../takt-native-abi", features = ["ecdsa", "rsa", "aes-gcm"] }
takt-board-stm32f401 = { path = "../takt-board-stm32f401" }
takt-board-support = { path = "../takt-board-support" }
takt-rt-baremetal = { path = "../takt-rt-baremetal" }
# Fuer den `Program`-Trait, den die Tickschleife ruft.
takt-rt-core = { path = "../takt-rt-core" }
# Das Pruefgeraet des Treiberrands (12.6, 13.8), wie auf dem Wirt.
takt-driver-probe = { path = "../takt-driver-probe" }
# Die Geraete-Traits, die die Geraete des Boards erfuellen (12.6), und die
# Griffe der Jobs: Unter RTIC verteilt die Takt-Aufgabe, die Job-Aufgabe
# rechnet (4.5).
takt-embed = { path = "../takt-embed" }

# `critical-section-single-core` liefert die Implementierung, die die PAC
# fuer `Peripherals::take()` braucht: Auf einem Einkern-System ohne
# Betriebssystem ist ein kritischer Abschnitt schlicht „Interrupts aus".
# Ohne sie fehlt dem Linker `_critical_section_1_0_acquire`.
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# Der Startcode: Vektortabelle, `.data`-Kopie, `.bss`-Nullung, `#[entry]`.
#
# `set-vtor` ist hier **noetig, nicht optional**: Die Anwendung liegt
# hinter dem Bootloader bei 0x0800_4000, der Kern liest seine
# Interrupt-Vektoren aber ueber `VTOR`, das nach Reset auf 0x0800_0000
# zeigt. Ohne das Feature spraenge der erste TIM2-Interrupt in den
# Bootloader — das Programm liefe an, bis der Tick kommt, und dann waere
# es weg. Ein Fehler, der wie ein Aufhaenger aussieht und keiner ist.
cortex-m-rt = { version = "0.7", features = ["set-vtor"] }
stm32f4 = { version = "0.16", features = ["stm32f401", "rt"] }

# Profil `shared` unter RTIC 2 (12.8): Takt als hoechstpriore Aufgabe, mit
# einer Treiber-Aufgabe und einer Funk-ISR als Last. Ohne das Feature ist
# `takt` das Programm unter der Bare-Metal-Schleife.
rtic = { version = "2.3", features = ["thumbv7-backend"], optional = true }
rtic-sync = { version = "1.5", optional = true }
takt-rt-rtos = { path = "../takt-rt-rtos", optional = true }

# Ohne Panic-Handler linkt ein `no_std`-Binary nicht. `panic-halt` haelt
# an, statt zu melden — fuer den Bring-up richtig: Eine Panik ist hier ein
# Fehler in der TCB, und ein haengendes Board faellt auf, weil die LED
# stehen bleibt.
panic-halt = "1.0"

[features]
rtos = ["dep:rtic", "dep:rtic-sync", "dep:takt-rt-rtos"]

# Ein Bring-up-Programm ist nur mit Optimierung brauchbar: Ohne sie
# braucht ein Tick ein Vielfaches, und die Periodenmessung misst den
# Debug-Modus statt die Hardware.
[profile.dev]
panic = "abort"

[profile.release]
# `abort` statt Abwickeln: Ohne `std` gibt es keinen Entwickler, der
# einen Panic auffaengt, und der Abwickelcode kostet Flash fuer nichts.
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"

# Die korrekt gerundete Mathematik (4.2) rechnet mit Ganzzahlen ueber 128 und
# 256 Bit. Mit `3` statt `s` braucht ihr teuerster Aufruf auf diesem Board
# 25 bis 29 % weniger Zyklen (`acos` in `f64` 84 701 statt 113 605), und ihre
# Laufzeit steht in jedem Budget, das sie ruft (FB-344). Der C6 bleibt bei
# `s`, siehe dort.
[profile.release.package.libtaktm]
opt-level = 3

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
