[package]
name = "takt-bringup-esp32c6"
version = "0.1.0"
description = "Takt: Bring-up-Programm fuer den ESP32-C6 — Tick, Telemetrie ueber USB-Serial-JTAG"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

# Eigener Workspace, wie das F401-Bring-up: Interrupt-Handler und C-ABI
# brauchen `unsafe`, und das workspace-weite `forbid` (13.4) laesst sich
# nicht lokal aufheben (plan/esp32c6.md 2).
[workspace]

# Der Bau uebersetzt das Takt-Programm mit: `takt-conformance` erzeugt den
# Rahmen und ruft `takt build` (`bringup`), `takt-llvm` nennt die Flags.
[build-dependencies]
takt-conformance = { path = "../takt-conformance", default-features = false }
takt-llvm = { path = "../takt-llvm" }

[dependencies]
# Fuer das Messprogramm `natives` (13.8): die kuratierten Natives und ihre
# Einstiege, wie der erzeugte Code sie ruft.
takt-native = { path = "../takt-native" }
takt-native-abi = { path = "../takt-native-abi", features = ["ecdsa", "rsa", "aes-gcm"] }
takt-board-esp32c6 = { path = "../takt-board-esp32c6" }
takt-rt-baremetal = { path = "../takt-rt-baremetal" }
takt-rt-core = { path = "../takt-rt-core" }
# Das Pruefgeraet des Treiberrands (12.6, 13.8), wie auf dem Wirt.
takt-driver-probe = { path = "../takt-driver-probe" }

# Start, Speicherkarte und Abbildformat des XIP-Chips (plan/esp32c6.md 2).
esp-hal = { version = "1.2.1", features = ["esp32c6", "unstable"] }
# App-Deskriptor im Abbild: der ROM-Bootloader und `probe-rs` verlangen ihn.
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }
# Gesperrte Interrupts um eine Messung (`bench`); die Umsetzung stellt `esp-hal`.
critical-section = "1.2"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
# Gemessen: 20 % weniger Flash als `3`, `z` ist groesser als `s`. Auch die
# korrekt gerundete Mathematik bleibt bei `s`: Der C6 fuehrt aus dem Flash
# ueber einen Cache aus, und mit `3` wurde ihr teuerster Aufruf mit kaltem
# Cache nicht schneller (`f64` 155 631 statt 158 188 Zyklen), in `f32`
# langsamer (125 902 statt 82 126) — anders als auf dem F401 ohne Cache
# (FB-344).
opt-level = "s"
