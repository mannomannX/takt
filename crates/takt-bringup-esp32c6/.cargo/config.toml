# Das Ziel des Bring-up-Programms (RV32IMAC, plan/esp32c6.md).
#
# Die Linker-Argumente stehen in `build.rs`, nicht hier: Diese Datei gilt
# nur, wenn `cargo` aus diesem Verzeichnis laeuft.

[build]
target = "riscv32imac-unknown-none-elf"

[env]
# 12.3 (`xip_flash`): `esp-hal` zieht damit `rwtext_hook.x` in `.rwtext`
# — dort legt `build.rs` das Takt-Programm ins RAM.
ESP_HAL_CONFIG_USE_RWTEXT_LD_HOOK = "true"
# Sprungtabellen im Flash: 2,4 KB RAM, die nur Fehlerpfade lesen.
ESP_HAL_CONFIG_PLACE_SWITCH_TABLES_IN_RAM = "false"

[target.riscv32imac-unknown-none-elf]
# Flashen und Mitlesen ueber USB-Serial-JTAG; `probe-rs` kennt den Chip.
runner = "probe-rs run --chip esp32c6"
