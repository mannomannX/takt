[package]
name = "takt-crypto"
version = "0.1.0"
description = "Takt: Kryptographie mit gepruefter Abhaengigkeit — ECDSA P-256, RSA-3072 und AES-GCM je hinter einem Feature (Referenz 4.5, 9.5)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `takt-native` bleibt abhaengigkeitsfrei; was eine Abhaengigkeit braucht,
# steht hier, hinter einem Feature und namentlich im TCB-Manifest des
# Lauf-Headers (plan/m6.md 2.4).
[features]
ecdsa = ["dep:p256"]
rsa = ["dep:crypto-bigint"]
aes-gcm = ["dep:aes-gcm"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"], optional = true }
crypto-bigint = { version = "0.5.5", default-features = false, optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"], optional = true }
takt-native = { path = "../takt-native" }

[lints]
workspace = true
