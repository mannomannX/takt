[package]
name = "takt-trampoline-stm32f401"
version = "0.1.0"
description = "Takt: das Sprungbrett der Black Pill in Sektor 1 — startet die Anwendung in Sektor 4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Eigener Workspace wie das Board-Crate: Der Sprung in die Anwendung braucht
# `unsafe`, und `forbid` (13.4) laesst sich nicht lokal aufheben.
[workspace]

[dependencies]
# Der Weg in den DFU-Bootloader des ROM, wenn keine Anwendung da ist.
takt-board-stm32f401 = { path = "../takt-board-stm32f401", features = ["trampoline"] }
cortex-m = "0.7"
# Ohne `set-vtor`: Das Sprungbrett nimmt keinen Interrupt an, und die
# Anwendung setzt `VTOR` selbst.
cortex-m-rt = "0.7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = "warn"
