[package]
name = "takt-prove"
version = "0.1.0"
description = "Takt: Kodierung der Schrittfunktion als Transitionssystem, SMT-LIB2-Export und k-Induktion (Referenz 13.3)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
takt-diag = { path = "../takt-diag" }
takt-mir = { path = "../takt-mir" }
# Ein Gegenbeispiel wird im Interpreter nachgespielt (plan/m6.md 2.8).
takt-interp = { path = "../takt-interp" }

[dev-dependencies]
# Ein fehlendes Werkzeug ist ein Fehler, kein Bestehen (FB-392).
takt-testkit = { path = "../takt-testkit" }
takt-sema = { path = "../takt-sema" }
# Die Programme der Suite `beweiser` stehen im Manifest des Korpus (FB-378).
takt-conformance = { path = "../takt-conformance" }
# Der Interpreter in der Schleife aus 12.1, mit Schlaf (9.9).
takt-rt-core = { path = "../takt-rt-core" }
# Interpreter gegen erzeugten Code an kleinen Programmen (Satz 9.4.4).
takt-llvm = { path = "../takt-llvm" }

[lints]
workspace = true
