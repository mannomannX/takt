[workspace]
resolver = "3"
exclude = [
    # Eigener Workspace, mit Absicht: Registerzugriff braucht `unsafe`,
    # und `forbid` (13.4) laesst sich nicht lokal aufheben. 9.5 fuehrt
    # Treiber in der Trusted Computing Base — dort faellt die Grenze,
    # und sie wird dadurch sichtbar statt verwischt. Gebaut und
    # geprueft wird das Crate von `tools/embedded.sh`.
    "crates/takt-board-blackpill",
]

members = [
    "crates/libtaktm",
    "crates/takt-native",
    "crates/takt-match",
    "crates/takt-diag",
    "crates/takt-syntax",
    "crates/takt-mir",
    "crates/takt-hal",
    "crates/takt-rt-core",
    "crates/takt-rt-linux",
    "crates/takt-rt-baremetal",
    "crates/takt-board-support",
    "crates/takt-llvm",
    "crates/takt-conformance",
    "crates/takt-interp",
    "crates/takt-sema",
    "crates/takt-cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
