[workspace]
resolver = "3"
exclude = [
    # Eigener Workspace, mit Absicht: Registerzugriff braucht `unsafe`,
    # und `forbid` (13.4) laesst sich nicht lokal aufheben. 9.5 fuehrt
    # Treiber in der Trusted Computing Base — dort faellt die Grenze,
    # und sie wird dadurch sichtbar statt verwischt. Gebaut und
    # geprueft wird das Crate von `tools/embedded.sh`.
    "crates/takt-board-stm32f401",
    "crates/takt-board-esp32c6",
    # Die C-Einstiege der kuratierten Natives fuer den erzeugten Code (FB-293).
    "crates/takt-native-abi",
    # Der MCU-Rahmen auf dem Wirt, fuer `takt driver-test --crate` (13.8).
    "crates/takt-bringup-host",
    # Takt als Baustein in Rust (12.11): Die Testhilfe stellt die Leitung
    # des Rahmens als C-Funktionen.
    "crates/takt-embed",
]

members = [
    "crates/libtaktm",
    "crates/takt-native",
    "crates/takt-crypto",
    "crates/takt-match",
    "crates/takt-diag",
    "crates/takt-syntax",
    "crates/takt-mir",
    "crates/takt-hal",
    "crates/takt-rt-core",
    "crates/takt-rt-linux",
    "crates/takt-rt-baremetal",
    "crates/takt-board-support",
    "crates/takt-driver-probe",
    "crates/takt-llvm",
    "crates/takt-frame",
    "crates/takt-conformance",
    "crates/takt-testkit",
    "crates/takt-interp",
    "crates/takt-sema",
    "crates/takt-prove",
    "crates/takt-cli",
    "crates/takt-flash-weact",
    "crates/takt-trace-serial",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
# Zeilen statt voller Debuginfo: Die rund 200 Test-Binaries trugen je 110 bis
# 130 MB PDB, und das Zielverzeichnis lief waehrend eines Laufs voll.
# Backtraces nennen weiter Datei und Zeile.
debug = "line-tables-only"
