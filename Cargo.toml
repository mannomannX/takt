[workspace]
resolver = "3"
members = [
    "crates/libtaktm",
    "crates/takt-diag",
    "crates/takt-syntax",
    "crates/takt-mir",
    "crates/takt-hal",
    "crates/takt-rt-core",
    "crates/takt-llvm",
    "crates/takt-interp",
    "crates/takt-sema",
    "crates/takt-cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
